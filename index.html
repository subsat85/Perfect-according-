tr.click{cursor:pointer}tr.click:hover td{background:var(--soft)}

.lines td{padding:4px}.lines input,.lines select{padding:5px 6px}
.lines .it{min-width:190px}.lines .q{width:80px}.lines .m{width:95px}
.tot{font-size:18px;font-weight:800}
.modal{position:fixed;inset:0;background:rgba(8,10,30,.5);display:flex;align-items:flex-start;justify-content:center;padding:24px 10px;overflow:auto;z-index:50}

.modal h2{margin:0 0 12px;font-size:19px;padding-left:36px}
.modal .x{position:absolute;left:12px;top:12px;border:0;background:var(--soft);border-radius:8px;width:32px;height:32px;cursor:pointer;font-size:16px}
.errs{background:var(--bad-bg);color:var(--bad);border-radius:10px;padding:8px 12px;margin:10px 0;font-weight:600;font-size:13.5px}
.warns{background:var(--warn-bg);color:var(--warn);border-radius:10px;padding:8px 12px;margin:10px 0;font-size:13.5px}
.toasts{position:fixed;bottom:80px;left:50%;transform:translateX(-50%);display:flex;flex-direction:column;gap:6px;z-index:90;width:min(460px,92vw)}
.toast{background:var(--ink);color:var(--bg);padding:10px 14px;border-radius:10px;font-weight:600;box-shadow:var(--shadow)}
.toast.err{background:var(--bad);color:#fff}.toast.ok{background:var(--ok);color:#fff}
.bnav{display:none}
.empty{color:var(--muted);text-align:center;padding:24px}
dl.kv{display:grid;grid-template-columns:auto 1fr;gap:4px 14px;margin:0}dl.kv dt{color:var(--muted);font-weight:700}dl.kv dd{margin:0}
.sec{font-weight:800;margin:16px 0 8px;font-size:15px}
.drawer{position:fixed;inset:0;background:rgba(8,10,30,.5);z-index:60;display:flex;align-items:flex-end}
.drawer .in{background:var(--card);width:100%;border-radius:16px 16px 0 0;padding:14px;display:grid;grid-template-columns:1fr 1fr;gap:8px}
.drawer a{padding:12px;border:1px solid var(--line);border-radius:12px;text-decoration:none;color:var(--ink);font-weight:700}
@media (max-width:820px){
  .app{grid-template-columns:1fr}
  .side{display:none}
  .main{padding:12px 16px 96px}
  .bnav{display:flex;position:fixed;bottom:0;inset-inline:0;background:#0E2279;z-index:40;padding:6px 4px calc(6px + env(safe-area-inset-bottom));justify-content:space-around}
  .bnav a,.bnav button{color:#E7E1C6;text-decoration:none;font-size:11.5px;font-weight:700;display:flex;flex-direction:column;align-items:center;background:none;border:0;padding:2px 6px;cursor:pointer}
  .bnav .ic{font-size:19px;line-height:1.2}
  .bnav .on{color:#fff}
  .bnav .fab{background:#E7E1C6;color:#0E2279;border-radius:50%;width:48px;height:48px;justify-content:center;font-size:26px;margin-top:-18px;box-shadow:0 4px 10px rgba(0,0,0,.25)}
  .modal{padding:0}.modal .box{border-radius:0;min-height:100vh;padding:14px}
  .fg{grid-template-columns:1fr 1fr}
  .kpi b{font-size:17px}
}
@media (max-width:420px){.fg{grid-template-columns:1fr}.quick{grid-template-columns:1fr 1fr}}
</style>

<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script>
/* PERFECT — محرك المحاسبة (نسخة Artifact)
 * قيود مزدوجة مشتقة من العمليات المرحّلة. المخزون بالمتوسط المرجّح، والكميات محفوظة لكل موقع.
 * المحرك ما بيعتمد على الواجهة، وبيشتغل بالمتصفح وبـ Node.
 */
(function (root, factory) {
  if (typeof module === 'object' && module.exports) module.exports = factory();
  else root.PE = factory();
})(typeof self !== 'undefined' ? self : this, function () {
  'use strict';
  const r3 = (x) => Math.round((Number(x) || 0) * 1000 + (x >= 0 ? 1e-9 : -1e-9)) / 1000;
  const num = (x) => { const n = Number(x); return isFinite(n) ? n : 0; };
  const ym = (d) => String(d || '').slice(0, 7);

  /* ---------- الحسابات ---------- */
  const ACC = {
    cash: '1110', bank: '1120', adv: '1300', inv: '1400', prepaid: '1500',
    ap: '2100', accrued: '2200', capital: '3100', drawings: '3200', opening: '3300',
    sales: '4100', otherInc: '4300', cogs: '5100', invDiff: '5200', salaries: '6000',
  };
  const ACC_NAMES = {
    '1110': 'الصندوق (كاش)', '1120': 'البنك / الفيزا', '1300': 'سلف الموظفين', '1400': 'المخزون', '1500': 'مصاريف موزّعة (مدفوعة مقدماً)',
    '2100': 'ذمم التجار', '2200': 'فواتير مستحقة غير مدفوعة', '3100': 'رأس المال', '3200': 'المسحوبات الشخصية', '3300': 'أرصدة افتتاحية',
    '4100': 'المبيعات', '4300': 'إيرادات أخرى', '5100': 'تكلفة البضاعة المباعة', '5200': 'فروقات الجرد', '6000': 'رواتب الموظفين',
  };
  const ACC_TYPE = (code) => {
    const c = String(code)[0];
    return c === '1' ? 'asset' : c === '2' ? 'liability' : c === '3' ? 'equity' : c === '4' ? 'revenue' : c === '5' ? 'cogs' : 'expense';
  };
  const expAcc = (catId) => '6:' + catId; // حساب مصروف لكل بند
  function accName(code, cfg) {
    if (ACC_NAMES[code]) return ACC_NAMES[code];
    if (String(code).startsWith('6:')) { const c = (cfg.expCats || []).find((x) => x.id === code.slice(2)); return c ? c.name : 'مصروف'; }
    return code;
  }
  const PAY_ACC = { cash: ACC.cash, bank: ACC.bank, unpaid: ACC.accrued, credit: ACC.ap };

  /* ---------- أنواع العمليات ---------- */
  const TYPES = {
    sale: 'مبيعات', purchase: 'فاتورة شراء', preturn: 'مرتجع مشتريات', transfer: 'نقل بضاعة', count: 'جرد / تسوية مخزون',
    ostock: 'مخزون افتتاحي', expense: 'مصروف / فاتورة', billpay: 'تسديد فاتورة', spay: 'دفعة لتاجر', income: 'إيراد آخر',
    capital: 'إضافة رأس مال', drawing: 'مسحوبات شخصية', money: 'تحويل كاش ↔ بنك', opening: 'أرصدة افتتاحية',
    advance: 'سلفة موظف', advpay: 'سداد سلفة نقداً', payroll: 'راتب موظف',
  };
  const ORDER = { opening: 0, ostock: 1, capital: 2, purchase: 3, preturn: 4, transfer: 5, sale: 6, count: 7, expense: 8, billpay: 9, spay: 10, income: 11, drawing: 12, money: 13, advance: 14, advpay: 15, payroll: 16 };
  const PAY_NAMES = { cash: 'كاش', bank: 'بنك / فيزا', credit: 'آجل (ذمة)', unpaid: 'غير مدفوعة' };

  /* ---------- مجاميع ---------- */
  const saleLineNet = (l) => r3(num(l.qty) * num(l.price) - num(l.disc));
  function total(t) {
    switch (t.type) {
      case 'sale': return r3((t.lines || []).reduce((s, l) => s + saleLineNet(l), 0));
      case 'purchase': return r3((t.lines || []).reduce((s, l) => s + num(l.qty) * num(l.cost), 0) + num(t.extras));
      case 'preturn': case 'ostock': return r3((t.lines || []).reduce((s, l) => s + num(l.qty) * num(l.cost), 0));
      case 'transfer': case 'count': return 0;
      case 'opening': return r3(num(t.cash) + num(t.bank));
      case 'payroll': return payrollCalc(t).net;
      default: return r3(t.amount);
    }
  }
  function payrollCalc(t) {
    const gross = r3(num(t.base) - num(t.absDed) - num(t.lateDed) - num(t.otherDed) + num(t.bonus));
    return { gross, net: r3(gross - num(t.advDed)) };
  }
  const qtyOf = (t) => (t.lines || []).reduce((s, l) => s + num(l.qty != null ? l.qty : l.counted), 0);

  function monthsBetween(from, to) {
    const out = []; if (!from || !to || from > to) return out;
    let [y, m] = from.split('-').map(Number); const [ty, tm] = to.split('-').map(Number);
    while (y < ty || (y === ty && m <= tm)) { out.push(y + '-' + String(m).padStart(2, '0')); m++; if (m > 12) { m = 1; y++; } if (out.length > 120) break; }
    return out;
  }
  function sortTx(list) {
    return list.slice().sort((a, b) => (a.date < b.date ? -1 : a.date > b.date ? 1 : 0) || (ORDER[a.type] - ORDER[b.type]) || String(a.createdAt || '').localeCompare(String(b.createdAt || '')) || String(a.id).localeCompare(String(b.id)));
  }

  /* ---------- التحقق ---------- */
  function validate(t, st) {
    const e = [], cfg = st.cfg || {};
    const items = new Set((st.items || []).map((i) => i.id));
    const locs = new Set((cfg.locations || []).map((l) => l.id));
    if (!TYPES[t.type]) e.push('نوع عملية غير معروف');
    if (!/^\d{4}-\d{2}-\d{2}$/.test(t.date || '')) e.push('التاريخ مطلوب');
    if (cfg.startDate && t.date < cfg.startDate) e.push('التاريخ قبل تاريخ بدء النظام (' + cfg.startDate + ')');
    if (cfg.lockDate && t.date <= cfg.lockDate) e.push('الفترة مقفلة حتى ' + cfg.lockDate);
    const needLines = ['sale', 'purchase', 'preturn', 'transfer', 'count', 'ostock'];
    if (needLines.includes(t.type)) {
      if (!(t.lines || []).length) e.push('لازم سطر واحد عالأقل');
      (t.lines || []).forEach((l, i) => {
        const n = 'السطر ' + (i + 1) + ': ';
        if (!items.has(l.itemId)) e.push(n + 'اختار الصنف');
        if (t.type === 'count') { if (l.counted === '' || l.counted == null || num(l.counted) < 0) e.push(n + 'الكمية المعدودة مطلوبة'); }
        else if (t.type === 'sale') { if (!num(l.qty)) e.push(n + 'الكمية مطلوبة'); if (num(l.price) < 0) e.push(n + 'السعر سالب'); if (!locs.has(l.locId)) e.push(n + 'اختار الموقع'); }
        else { if (!(num(l.qty) > 0)) e.push(n + 'الكمية لازم تكون أكبر من صفر'); }
        if (['purchase', 'preturn', 'ostock'].includes(t.type) && num(l.cost) < 0) e.push(n + 'التكلفة سالبة');
      });
    }
    if (['purchase', 'preturn', 'ostock', 'count'].includes(t.type) && !locs.has(t.locId)) e.push('اختار الموقع');
    if (t.type === 'transfer') { if (!locs.has(t.from) || !locs.has(t.to)) e.push('اختار من وين ولوين'); else if (t.from === t.to) e.push('الموقعين لازم يكونوا مختلفين'); }
    if (['purchase', 'preturn', 'spay'].includes(t.type) && !(st.suppliers || []).some((s) => s.id === t.supplierId)) e.push('اختار التاجر');
    if (t.type === 'purchase') {
      if (!['cash', 'bank', 'credit'].includes(t.pay)) e.push('طريقة الدفع');
      if (t.pay !== 'credit' && (num(t.paid) < 0 || r3(t.paid) > total(t))) e.push('المدفوع لازم يكون بين صفر والإجمالي');
    }
    if (t.type === 'sale') {
      const tot = total(t), p = r3(num(t.cash) + num(t.bank));
      if (Math.abs(p - tot) > 0.0005) e.push('مجموع الكاش والفيزا (' + p + ') لازم يساوي إجمالي البيع (' + tot + ')');
    }
    if (['expense', 'billpay', 'spay', 'income', 'capital', 'drawing', 'money', 'advance', 'advpay'].includes(t.type) && !(num(t.amount) > 0)) e.push('المبلغ لازم يكون أكبر من صفر');
    if (t.type === 'expense') {
      if (!(cfg.expCats || []).some((c) => c.id === t.catId)) e.push('اختار بند المصروف');
      if (!['cash', 'bank', 'unpaid'].includes(t.pay)) e.push('طريقة الدفع');
      if (t.spread) { if (!t.spread.from || !t.spread.to || t.spread.from > t.spread.to) e.push('فترة توزيع المصروف غير صحيحة'); }
    }
    if (['billpay', 'spay', 'income', 'capital', 'drawing', 'advance', 'advpay', 'payroll'].includes(t.type) && !['cash', 'bank'].includes(t.pay)) e.push('ادفع من الكاش أو البنك');
    if (t.type === 'money' && (!['cash', 'bank'].includes(t.from) || !['cash', 'bank'].includes(t.to) || t.from === t.to)) e.push('اختار التحويل');
    if (['advance', 'advpay', 'payroll'].includes(t.type) && !(st.employees || []).some((x) => x.id === t.empId)) e.push('اختار الموظف');
    if (t.type === 'advance' && t.mode === 'inst' && !(num(t.count) >= 1)) e.push('عدد الأقساط');
    if (t.type === 'payroll') {
      if (!/^\d{4}-\d{2}$/.test(t.month || '')) e.push('شهر الراتب');

}

function unpaidBills() {
  const paid = {}; A.st.txns.filter((t) => t.status === 'posted' && t.type === 'billpay').forEach((t) => (paid[t.expenseId] = r3((paid[t.expenseId] || 0) + num(t.amount))));
  return A.st.txns.filter((t) => t.status === 'posted' && t.type === 'expense' && t.pay === 'unpaid').map((t) => ({ t, paid: paid[t.id] || 0, rem: r3(num(t.amount) - (paid[t.id] || 0)) })).filter((b) => b.rem > 0.0005).sort((a, b) => (a.t.date < b.t.date ? -1 : 1));
}

function txSummary(t) {
  switch (t.type) {
    case 'sale': return fq(E.qtyOf(t)) + ' قطعة' + (t.lines && t.lines.some((l) => l.inv) ? ' · ' + new Set(t.lines.map((l) => l.inv)).size + ' فاتورة' : '');
    case 'purchase': case 'preturn': return supName(t.supplierId) + ' · ' + locName(t.locId);
    case 'transfer': return locName(t.from) + ' ← ' + locName(t.to) + ' · ' + fq(E.qtyOf(t)) + ' قطعة';
    case 'count': case 'ostock': return locName(t.locId) + ' · ' + t.lines.length + ' صنف';
    case 'expense': return catName(t.catId) + (t.desc ? ' · ' + t.desc : '') + (t.spread ? ' · موزّع ' + t.spread.from + '←' + t.spread.to : '') + (t.pay === 'unpaid' ? ' · غير مدفوعة' : '');
    case 'billpay': { const ex = A.st.txns.find((x) => x.id === t.expenseId); return ex ? catName(ex.catId) + ' ' + (ex.ref || '') : ''; }
    case 'spay': return supName(t.supplierId);
    case 'advance': return empName(t.empId) + ' · ' + (t.mode === 'inst' ? t.count + ' أقساط من ' + t.startMonth : 'كاملة من راتب ' + (t.startMonth || ''));
    case 'advpay': return empName(t.empId);
    case 'payroll': return empName(t.empId) + ' · ' + fmonth(t.month);
    case 'money': return E.PAY_NAMES[t.from] + ' ← ' + E.PAY_NAMES[t.to];
    default: return t.desc || '';
  }
}

// شاشة رواتب الشهر
function payrollRows(month) {
  const ms = month + '-01', me = E.monthEnd(month), cfg = A.st.cfg;
  const posted = A.st.txns.filter((t) => t.type === 'payroll' && t.month === month && t.status === 'posted');
  const att = (A.f.att && A.f.att.month === month) ? A.f.att.map : {};
  const edits = (A.f.payEdits = A.f.payEdits && A.f.payEdits._m === month ? A.f.payEdits : { _m: month });
  return A.st.employees.filter((e) => (e.hireDate || '0') <= me && (!e.endDate || e.endDate >= ms) || posted.some((p) => p.empId === e.id)).map((e) => {
    const p = posted.find((x) => x.empId === e.id);
    if (p) return { e, p };
    // أيام العمل الفعلية إذا تعيّن أو انتهى بنص الشهر
    const days = Number(me.slice(8)); const from = e.hireDate > ms ? Number(e.hireDate.slice(8)) : 1; const to = e.endDate && e.endDate < me ? Number(e.endDate.slice(8)) : days;
    const part = from > 1 || to < days;
    const base = part ? r3(num(e.salary) / 30 * Math.min(30, to - from + 1)) : num(e.salary);
    const a = att[e.id] || att['#' + (e.code || '')] || {};
    const day = num(e.salary) / 30, minute = day / (num(cfg.dayHours) || 8) / 60;
    const r = Object.assign({ base, absDays: num(a.absent), absDed: r3(day * num(a.absent)), lateMin: num(a.late), lateDed: cfg.lateDeduct ? r3(minute * num(a.late)) : 0, otherDed: 0, bonus: 0, advDed: E.advanceDue(A.st, e.id, month) }, edits[e.id] || {});
    return { e, r, part, due: E.advanceDue(A.st, e.id, month) };
  });
}

function bindPayroll() {
  const f = A.f.pay;
  $('#pM').onchange = (e) => { f.month = e.target.value; render(); };
  $('#pD').onchange = (e) => (f.date = e.target.value); $('#pP').onchange = (e) => (f.pay = e.target.value);
  $('#pAtt').onchange = (e) => importAttendance(e, f.month);
  $$('[data-pe]').forEach((inpEl) => inpEl.addEventListener('change', (e) => {
    const ed = A.f.payEdits; const id = e.target.dataset.pe, k = e.target.dataset.pk; ed[id] = ed[id] || {}; ed[id][k] = num(e.target.value);
    const emp = A.st.employees.find((x) => x.id === id); const day = num(emp.salary) / 30;
    if (k === 'absDays') ed[id].absDed = r3(day * num(e.target.value));
    if (k === 'lateMin') ed[id].lateDed = A.st.cfg.lateDeduct ? r3(day / (num(A.st.cfg.dayHours) || 8) / 60 * num(e.target.value)) : 0;
    render();
  }));
  $('#pGo').onclick = async () => {
    const rows = payrollRows(f.month).filter((x) => !x.p && $('[data-pc="' + x.e.id + '"]') && $('[data-pc="' + x.e.id + '"]').checked);
    const docs = rows.map(({ e, r }) => Object.assign(newTx('payroll'), { empId: e.id, month: f.month, date: f.date, pay: f.pay, status: 'posted', postedAt: nowIso() }, r));
    const errs = []; docs.forEach((d) => E.validate(d, A.st).forEach((x) => errs.push(empName(d.empId) + ': ' + x)));
    if (errs.length) return toast(errs.slice(0, 3).join(' · '), 'err', 7000);
    if (!(await confirmBox('ترحيل الرواتب', docs.length + ' موظف · صافي ' + fmt(docs.reduce((s, d) => s + E.payrollCalc(d).net, 0)) + ' من ' + E.PAY_NAMES[f.pay] + ' بتاريخ ' + fdate(f.date), 'رحّل'))) return;
    for (const d of docs) await put('txns', d);
    audit('ترحيل رواتب ' + f.month, docs.length + ' موظف'); A.f.payEdits = null; toast('انرحّلت رواتب ' + docs.length + ' موظف', 'ok');
  };
}

/* ---- تصدير Excel ---- */
async function exportXlsx(title, tables, kpis) {
  if (!window.XLSX) return toast('مكتبة Excel ما تحمّلت — تأكد من الإنترنت', 'err');
  const wb = XLSX.utils.book_new(); const used = new Set();
  tables.forEach((t, ti) => {
    const aoa = [[(A.st.cfg.shopName || 'PERFECT') + ' — ' + title], ['تاريخ الطباعة: ' + today()], []];
    if (ti === 0 && kpis) { kpis.forEach((k) => aoa.push([k[0], r3(k[1])])); aoa.push([]); }
    const hr = aoa.length; aoa.push(t.head);
    t.rows.forEach((rw) => aoa.push(rw.map((c) => (typeof c === 'number' ? r3(c) : c == null ? '' : String(c)))));
    const ws = XLSX.utils.aoa_to_sheet(aoa);
    if (t.sum && t.rows.length) {
      const fr = hr + 1 + t.rows.length; // صف المجموع (0-based)
      ws[XLSX.utils.encode_cell({ r: fr, c: 0 })] = { t: 's', v: 'المجموع' };
      t.sum.forEach((c) => { const col = XLSX.utils.encode_col(c); ws[XLSX.utils.encode_cell({ r: fr, c })] = { t: 'n', v: r3(t.rows.reduce((a, rw) => a + num(rw[c]), 0)), f: 'SUM(' + col + (hr + 2) + ':' + col + (hr + 1 + t.rows.length) + ')' }; });
      ws['!ref'] = XLSX.utils.encode_range({ s: { r: 0, c: 0 }, e: { r: fr, c: t.head.length - 1 } });
    }
    ws['!cols'] = t.head.map((h, i) => ({ wch: Math.min(45, Math.max(10, String(h).length + 2, ...t.rows.slice(0, 200).map((rw) => String(rw[i] == null ? '' : rw[i]).length + 1))) }));
    ws['!views'] = [{ RTL: true }];
    let nm = String(t.name).replace(/[\\/?*[\]:]/g, ' ').slice(0, 28) || 'ورقة'; while (used.has(nm)) nm = nm.slice(0, 26) + ' ' + used.size; used.add(nm);
    XLSX.utils.book_append_sheet(wb, ws, nm);
  });
  wb.Workbook = { Views: [{ RTL: true }] };
  const buf = XLSX.write(wb, { type: 'array', bookType: 'xlsx' });
  await saveFile(title.replace(/[\\/:*?"<>|]/g, '-') + '.xlsx', new Uint8Array(buf));
}
/* ===== الاستيراد من Excel ===== */
const normH = (s) => String(s == null ? '' : s).replace(/[\s.]/g, '').replace(/[أإآ]/g, 'ا').replace(/ة/g, 'ه').replace(/ى/g, 'ي').toLowerCase();
function colIdx(H, names) { const h = H.map(normH); for (const n of names) { const i = h.indexOf(normH(n)); if (i >= 0) return i; } for (const n of names) { const i = h.findIndex((x) => x && x.includes(normH(n))); if (i >= 0) return i; } return -1; }
async function readRows(file, sheetPick) {
  if (!window.XLSX) throw new Error('مكتبة Excel ما تحمّلت — تأكد من الإنترنت');
  const wb = XLSX.read(await file.arrayBuffer(), { type: 'array' });
  const name = (sheetPick && wb.SheetNames.find(sheetPick)) || wb.SheetNames[0];
  return XLSX.utils.sheet_to_json(wb.Sheets[name], { header: 1, defval: null, raw: true });
}
function headerRow(rows, mustHave) { return rows.findIndex((r) => r && mustHave.every((m) => r.some((c) => normH(c).includes(normH(m))))); }
function parseDate(v) {
  if (v == null || v === '') return '';
  if (typeof v === 'number') { const d = XLSX.SSF.parse_date_code(v); return d.y + '-' + pad(d.m) + '-' + pad(d.d); }
  const s = String(v);
  let m = s.match(/(\d{1,2})[\/\-.](\d{1,2})[\/\-.](\d{4})/); if (m) return m[3] + '-' + pad(m[2]) + '-' + pad(m[1]);
  m = s.match(/(\d{4})-(\d{2})-(\d{2})/); return m ? m[0] : '';
}
const pickFile = (accept) => new Promise((res) => {
  const i = document.createElement('input'); i.type = 'file'; i.accept = accept || XL_ACCEPT;
  i.style.cssText = 'position:fixed;left:-9999px;top:0;opacity:0'; document.body.appendChild(i);
  i.addEventListener('change', () => { const f = i.files[0] || null; i.remove(); res(f); });
  i.addEventListener('cancel', () => { i.remove(); res(null); });
  i.click();
});
async function ensureItems(list) { // list: [{bc,name,price,cost,cat}]
  const created = [];
  for (const x of list) {
    if (itemByBc(x.bc)) continue;
    const it = { id: uid(), barcode: String(x.bc).trim(), name: String(x.name || x.bc).trim(), cat: x.cat || '', price: num(x.price), cost: num(x.cost), loc: x.loc || '', active: true };
    A.st.items.push(it); created.push(it); await put('items', it);
  }
  return created;
}

  const H = rows[hi], c = { bc: colIdx(H, ['الباركود', 'باركود']), name: colIdx(H, ['الاسم', 'اسم الصنف', 'الصنف', 'رقم موديل', 'صنف']), cat: colIdx(H, ['التصنيف', 'نوع القطعه']), price: colIdx(H, ['سعر البيع', 'السعر']), cost: colIdx(H, ['التكلفة', 'الإفرادي ب.ض']) };

A.actions.impSales = async () => {
  const f = await pickFile(); if (!f) return;
  let rows; try { rows = await readRows(f); } catch (e) { return toast(e.message, 'err'); }
  const hi = headerRow(rows, ['الباركود', 'الكمية']); if (hi < 0) return toast('ما لقيت أعمدة الباركود والكمية', 'err');
  const H = rows[hi];
  const c = { inv: colIdx(H, ['رقم الفاتورة']), date: colIdx(H, ['تاريخ الفاتورة', 'التاريخ']), bc: colIdx(H, ['الباركود']), name: colIdx(H, ['اسم الصنف', 'الصنف']), price: colIdx(H, ['السعر']), qty: colIdx(H, ['الكمية']), disc: colIdx(H, ['الخصم']), net: colIdx(H, ['الصافي مع ضريبة']) };
  if ([c.inv, c.date, c.bc, c.price, c.qty].some((i) => i < 0)) return toast('لازم أعمدة: رقم الفاتورة، تاريخ الفاتورة، الباركود، السعر، الكمية', 'err', 6000);

  const bad = lines.filter((l) => !l.date);
  const seen = new Set(); A.st.txns.filter((t) => t.type === 'sale' && t.status !== 'void').forEach((t) => (t.lines || []).forEach((l) => l.inv && seen.add(String(l.inv))));
  const start = A.st.cfg.startDate, lock = A.st.cfg.lockDate || '';
  const dup = lines.filter((l) => seen.has(l.inv)), early = lines.filter((l) => l.date && (l.date < start || (lock && l.date <= lock)));
  const ok = lines.filter((l) => l.date && !seen.has(l.inv) && !(l.date < start || (lock && l.date <= lock)));
  const mismatch = ok.filter((l) => l.net != null && Math.abs(r3(l.qty * l.price - l.disc) - l.net) > 0.01);
  const days = Array.from(new Set(ok.map((l) => l.date))).sort();
  const newBc = Array.from(new Set(ok.map((l) => l.bc).filter((b) => !itemByBc(b))));
  const invs = new Set(ok.map((l) => l.inv));
  const total = r3(ok.reduce((s, l) => s + l.qty * l.price - l.disc, 0));
  const m = modal('<h2>استيراد مبيعات</h2><dl class="kv"><dt>الملف</dt><dd>' + esc(f.name) + '</dd><dt>جاهز</dt><dd><b>' + invs.size + ' فاتورة</b> · ' + ok.length + ' سطر · ' + fq(ok.reduce((s, l) => s + l.qty, 0)) + ' قطعة · <b>' + fmt(total) + '</b></dd>' +
    (days.length ? '<dt>الأيام</dt><dd>' + fdate(days[0]) + ' — ' + fdate(days[days.length - 1]) + ' (' + days.length + ' يوم = ' + days.length + ' عملية بيع)</dd>' : '') +
    '<dt>مستوردة قبل (بتنتجاهل)</dt><dd>' + new Set(dup.map((l) => l.inv)).size + ' فاتورة</dd><dt>قبل تاريخ البدء/الإقفال</dt><dd>' + early.length + ' سطر</dd>' + (bad.length ? '<dt>بدون تاريخ</dt><dd class="neg">' + bad.length + ' سطر</dd>' : '') +
    '<dt>أصناف جديدة</dt><dd>' + newBc.length + (newBc.length ? ' <span class="mut">(بتنضاف بدون تكلفة — سجّل فاتورة شرائها أو تكلفتها)</span>' : '') + '</dd>' + (mismatch.length ? '<dt>تنبيه</dt><dd class="neg">' + mismatch.length + ' سطر الصافي فيه مختلف عن السعر×الكمية−الخصم</dd>' : '') + '</dl>' +
    '<div class="fg" style="margin-top:12px">' + fld('تنخصم البضاعة من', '<select id="isLoc"><option value="item">حسب طابق الصنف</option>' + locs().map((l) => opt(l.id, l.name)).join('') + '</select>', 'الأصناف بدون طابق بتنخصم من أول طابق') + fld('القبض', '<select id="isPay">' + opt('cash', 'كاش') + opt('bank', 'فيزا / بنك') + '</select>', 'بتقدر تعدل كل يوم لحاله بعدين لو في فيزا') + fld('الحالة', '<select id="isSt">' + opt('posted', 'ترحيل مباشر') + opt('draft', 'مسودات للمراجعة') + '</select>') + '</div>' +
    '<div class="row end" style="margin-top:12px"><button class="btn p" id="isGo" ' + (ok.length ? '' : 'disabled') + '>استيراد</button></div>', { small: true });
  m.querySelector('#isGo').onclick = async () => {
    m.querySelector('#isGo').disabled = true;
    const lm = m.querySelector('#isLoc').value, pay = m.querySelector('#isPay').value, status = m.querySelector('#isSt').value;
    const firstFloor = (locs().find((l) => l.kind === 'floor') || locs()[0]).id;
    await ensureItems(newBc.map((b) => { const l = ok.find((x) => x.bc === b); return { bc: b, name: l.name, price: l.price, loc: lm !== 'item' ? lm : '' }; }));
    for (const d of days) {
      const ls = ok.filter((l) => l.date === d).map((l) => { const it = itemByBc(l.bc); const loc = lm === 'item' ? (it.loc && locs().some((x) => x.id === it.loc) ? it.loc : firstFloor) : lm; return { itemId: it.id, locId: loc, qty: l.qty, price: l.price, disc: l.disc, inv: l.inv }; });
      const t = newTx('sale', { date: d, lines: ls, desc: 'مستورد: ' + f.name, ref: '' }); const tot = E.total(t);
      t.cash = pay === 'cash' ? tot : 0; t.bank = pay === 'bank' ? tot : 0;
      if (status === 'posted') { const er = E.validate(t, A.st); if (er.length) { toast(fdate(d) + ': ' + er[0] + ' — انحفظ كمسودة', 'err', 6000); } else { t.status = 'posted'; t.postedAt = nowIso(); } }
      await put('txns', t);
    }
    audit('استيراد مبيعات', f.name + ' · ' + invs.size + ' فاتورة · ' + fmt(total) + ' · ' + days.length + ' يوم'); closeModal(m); toast('انستوردت ' + invs.size + ' فاتورة', 'ok', 5000);
  };
};

/* جرد / مخزون افتتاحي من Excel */
async function readCountFile() {
  const f = await pickFile(); if (!f) return null;
  let rows; try { rows = await readRows(f); } catch (e) { toast(e.message, 'err'); return null; }
  const hi = headerRow(rows, ['باركود']); if (hi < 0) { toast('ما لقيت عمود الباركود', 'err'); return null; }
  const H = rows[hi]; const c = { bc: colIdx(H, ['الباركود', 'باركود']), qty: colIdx(H, ['الكمية', 'عدد', 'العدد', 'المعدود']), cost: colIdx(H, ['التكلفة', 'الإفرادي ب.ض']), name: colIdx(H, ['الاسم', 'اسم الصنف', 'الصنف', 'رقم موديل', 'صنف']) };
  if (c.qty < 0) { toast('لازم عمود الكمية / العدد', 'err'); return null; }
  const agg = new Map();
  rows.slice(hi + 1).forEach((r) => { if (!r || r[c.bc] == null || r[c.qty] == null || r[c.qty] === '') return; const bc = String(r[c.bc]).trim(); const x = agg.get(bc) || { bc, qty: 0, cost: c.cost >= 0 ? r[c.cost] : null, name: c.name >= 0 ? r[c.name] : '' }; x.qty = r3(x.qty + num(r[c.qty])); agg.set(bc, x); });
  return { f, list: Array.from(agg.values()) };
}
A.actions.impCount = async () => {
  const r = await readCountFile(); if (!r) return;
  const unknown = r.list.filter((x) => !itemByBc(x.bc));
  if (unknown.length) await ensureItems(unknown.map((x) => ({ bc: x.bc, name: x.name })));
  openTx(newTx('count', { lines: r.list.map((x) => ({ itemId: itemByBc(x.bc).id, counted: x.qty })), desc: 'من ملف ' + r.f.name }));
  toast('اختار الموقع وراجع الفروقات قبل الترحيل. الأصناف اللي مش بالملف ما بتتأثر.' + (unknown.length ? ' (' + unknown.length + ' صنف جديد انضاف)' : ''), '', 8000);
};

// زر «استيراد سطور» داخل النموذج
async function importLinesInto(e, d, redraw) {
  const f = e.target.files[0]; e.target.value = ''; if (!f) return;
  let rows; try { rows = await readRows(f); } catch (x) { return toast(x.message, 'err'); }
  const hi = headerRow(rows, ['باركود']); if (hi < 0) return toast('ما لقيت عمود الباركود', 'err');
  const H = rows[hi]; const c = { bc: colIdx(H, ['الباركود', 'باركود']), qty: colIdx(H, ['الكمية', 'عدد', 'العدد', 'المعدود']), cost: colIdx(H, ['الإفرادي ب.ض', 'الافرادي بض', 'تكلفة الوحدة', 'التكلفة']), sp: colIdx(H, ['سعر البيع']), price: colIdx(H, ['السعر']), name: colIdx(H, ['اسم الصنف', 'الصنف', 'الاسم', 'رقم موديل', 'صنف']) };
  const src = rows.slice(hi + 1).filter((r) => r && r[c.bc] != null && String(r[c.bc]).trim());
  const unknown = src.filter((r) => !itemByBc(r[c.bc]));
  let created = [];
  // الشراء والجرد والمخزون الافتتاحي: الأصناف الجديدة بتنضاف تلقائياً
  if (unknown.length && ['purchase', 'ostock', 'count', 'preturn'].includes(d.type)) {
    const seen = new Map(); unknown.forEach((r) => seen.set(String(r[c.bc]).trim(), r));
    created = await ensureItems(Array.from(seen.values()).map((r) => ({ bc: r[c.bc], name: c.name >= 0 ? r[c.name] : '', price: c.sp >= 0 ? r[c.sp] : c.price >= 0 ? r[c.price] : 0, cost: c.cost >= 0 ? r[c.cost] : 0 })));
  }
  let n = 0; const miss = [];
  src.forEach((r) => {
    const it = itemByBc(r[c.bc]); if (!it) { miss.push(r[c.bc]); return; }
    const q = c.qty >= 0 ? num(r[c.qty]) : 1; if (!q && d.type !== 'count') return; n++;
    if (d.type === 'count') d.lines.push({ itemId: it.id, counted: q });
    else if (d.type === 'sale') d.lines.push({ itemId: it.id, locId: it.loc || d.locId, qty: q, price: c.price >= 0 ? num(r[c.price]) : it.price, disc: 0 });
    else if (d.type === 'transfer') d.lines.push({ itemId: it.id, qty: q });
    else { const l = { itemId: it.id, qty: q, cost: c.cost >= 0 ? r3(r[c.cost]) : it.cost || '' }; if (d.type === 'purchase') l.sp = c.sp >= 0 && r[c.sp] != null ? num(r[c.sp]) : it.price || ''; d.lines.push(l); }
  });
  if (d.type === 'purchase' && !d.ref) { const m0 = f.name.match(/\d+/); if (m0) { d.ref = m0[0]; const el = document.querySelector('.modal [data-k="ref"]'); if (el && !el.value) el.value = d.ref; } }
  redraw();
  toast(n + ' سطر' + (created.length ? ' · ' + created.length + ' صنف جديد انضاف' : '') + (miss.length ? ' · باركودات مش معروفة: ' + miss.slice(0, 5).join('، ') + ' — ضيفها من المخزون والأصناف' : ''), miss.length ? 'err' : 'ok', 7000);
}

/* ملف تطبيق الدوام: ورقة «ملخص الموظفين» */
async function importAttendance(e, month) {
  const f = e.target.files[0]; e.target.value = ''; if (!f) return;
  let rows; try { rows = await readRows(f, (n) => n.includes('ملخص')); } catch (x) { return toast(x.message, 'err'); }
  const hi = headerRow(rows, ['الموظف']); if (hi < 0) return toast('ما لقيت ورقة الملخص (عمود «الموظف»)', 'err');
  const H = rows[hi]; const c = { name: colIdx(H, ['الموظف']), code: colIdx(H, ['رقم الموظف']), abs: colIdx(H, ['أيام الغياب']), late: colIdx(H, ['تأخير (د)', 'تأخير']) };
  const map = {}; const miss = [];
  rows.slice(hi + 1).forEach((r) => {
    if (!r || !r[c.name] || String(r[c.name]).trim() === 'الإجمالي') return;
    const code = c.code >= 0 && r[c.code] != null ? String(r[c.code]).trim() : '', name = String(r[c.name]).trim();
    const emp = A.st.employees.find((x) => code && x.code === code) || A.st.employees.find((x) => x.name.trim() === name);
    if (!emp) { miss.push(name); return; }
    map[emp.id] = { absent: c.abs >= 0 ? num(r[c.abs]) : 0, late: c.late >= 0 ? num(r[c.late]) : 0 };
  });
  A.f.att = { month, map, file: f.name }; A.f.payEdits = null;
  audit('استيراد ملف الدوام', f.name + ' · ' + month + ' · ' + Object.keys(map).length + ' موظف');
  toast('انقرأ ' + Object.keys(map).length + ' موظف' + (miss.length ? ' · مش معروفين: ' + miss.join('، ') : ''), miss.length ? 'err' : 'ok', 7000);
  render();
}
boot();
</script>
</body></html>
